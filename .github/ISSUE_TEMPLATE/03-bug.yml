name: Bug
description: Something is broken
title: "[REF] "
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: What actually happens }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: ["local","dev","staging","production","preview environment"]
    validations: { required: true }
  - type: checkboxes
    id: test
    attributes:
      label: Before you close this
      options:
        - label: A failing automated test was written first, and it now passes
