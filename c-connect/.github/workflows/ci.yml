name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- secret scanning: nothing sensitive should ever reach the repo ----
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      # ---- application services -------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
        continue-on-error: true

      - name: Install, lint, test, build
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            echo "No package.json yet — CL3 wires this up in CD-01."
          fi

      # ---- infrastructure --------------------------------------------------
      - name: Terraform format and validate
        run: |
          if [ -d infra ]; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update -qq && sudo apt-get install -y terraform
            terraform -chdir=infra fmt -check -recursive
          else
            echo "No infra/ yet — CL1 creates it in LZ-01."
          fi

      - name: Done
        run: echo "CI complete. Extend this workflow in ticket CD-01."
